<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>

    <h1>Digital Clock</h1>
    <h2 id="clock"></h2>

    <script>
        function showTime() {
            const time = new Date();
            document.getElementById("clock").innerHTML =
                time.toLocaleTimeString();
        }

        setInterval(showTime, 1000);
        showTime();
    </script>

</body>
</html>
